# Static site — no build step. Publish repo root as-is.
[build]
  publish = "."
  command = ""

# Serve raw HTML. Netlify's HTML post-processing (minify/optimize) re-quotes
# attributes and escapes inner quotes inside inline style="...url('...')...",
# producing invalid CSS (background-image breaks). Disable it so HTML is served
# verbatim, exactly like the source — matching GitHub Pages behaviour.
[build.processing]
  skip_processing = true

# /stic live vote: phone page at /stic/ (static), API at /stic/api/* (netlify/functions/stic-api.mjs,
# storage in Netlify Blobs). The repo root is published as-is, so never serve the function source,
# the package files or node_modules as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
